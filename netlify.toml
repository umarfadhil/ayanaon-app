[build]
  functions = "netlify/functions"
  publish = "public"

# Force HTTPS
[[redirects]]
  from = "http://ayanaon.app/*"
  to = "https://www.ayanaon.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ayanaon.app/*"
  to = "https://www.ayanaon.app/:splat"
  status = 301
  force = true

# Redirect non-www to www
[[redirects]]
  from = "https://ayanaon.app/*"
  to = "https://www.ayanaon.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Dynamic SEO routes retained for the Netlify rollback deployment.
[[redirects]]
  from = "/pin/*"
  to = "/.netlify/functions/api/pin/:splat"
  status = 200

[[redirects]]
  from = "/toko/*"
  to = "/.netlify/functions/api/toko/:splat"
  status = 200

[[redirects]]
  from = "/kategori"
  to = "/.netlify/functions/api/kategori"
  status = 200

[[redirects]]
  from = "/kategori/"
  to = "/.netlify/functions/api/kategori"
  status = 200

[[redirects]]
  from = "/kategori/*"
  to = "/.netlify/functions/api/kategori/:splat"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/seo/sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/seo/robots"
  status = 200
